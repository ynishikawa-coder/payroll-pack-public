name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest を入れる
        run: python -m pip install pytest
      - name: 検査
        env:
          # 顧客の語の束は repo に持たない。repo の secret に置いた時だけ渡る（無ければ skip）
          PAYROLL_NG_WORDS: ${{ secrets.PAYROLL_NG_WORDS }}
        run: bash scripts/check_all.sh
