name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 履歴と版の印を全部取る。骨の自己検査が main からの差と、出した版の節が印の時と同じかを見る
      # （浅いと CI では赤＝tests/test_骨.py の _手元に無い）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest を入れる
        run: python -m pip install pytest
      # 確認ページの検査（土台の skill qa-html の check.mjs）を当てるため node を入れ、check.mjs を土台の版の印で取る。
      # check.mjs は repo に写さない（土台の物は窓の環境が入れる決まり）。repo の外（runner の作業場）に置き、検査の入口が
      # repo の file として読まないようにする。public なので秘密は要らない。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 土台の版の印は .github/workflows/土台の版.json の「土台」の 1 か所から読む（ここに印を書かない）。
      - name: 土台の版を読む
        id: af
        run: >-
          python3 -c 'import json, re, sys;
          v = json.load(open(".github/workflows/土台の版.json", encoding="utf-8"))["土台"];
          ok = re.fullmatch(r"v[0-9]+[.][0-9]+[.][0-9]+", v);
          print("ref=" + v) if ok else sys.exit("✗ 土台の版の印の形でない: " + v)' >> "$GITHUB_OUTPUT"
      - name: 確認ページの検査の道具を取る
        env:
          AF_REF: ${{ steps.af.outputs.ref }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "${AF_REF}" https://github.com/ynishikawa-coder/agent-foundation-public "${RUNNER_TEMP}/agent-foundation-public"
          f="${RUNNER_TEMP}/agent-foundation-public/plugins/docs-kit/skills/qa-html/check.mjs"
          test -f "$f"
          echo "QA_HTML_CHECK=$f" >> "$GITHUB_ENV"
      - name: 検査
        env:
          # 顧客の語の束は repo に持たない。repo の secret に置いた時だけ渡る（無ければ skip）
          PAYROLL_NG_WORDS: ${{ secrets.PAYROLL_NG_WORDS }}
        run: bash scripts/check_all.sh
      # 確認ページの検査の試験を名で出す（skip でなく pass した記録を CI に残す）。
      - name: 確認ページの検査の試験を名で見る
        run: python -m pytest -v -rs -k "qa_html or 検査の道具" tests/確認ページ
