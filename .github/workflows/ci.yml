name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じ PR に次の push が来たら、その PR の古い実行を取り消す（古い先端の結果は要らない・走り切ると Actions の分を払う）。
# main への push は 1 回ずつ別の group（run_id）＝取り消しも順番待ちの差し替えも起きない。
# tag.yml が workflow_run で main の各 commit の ci の完了を待つので、main の実行は消さない。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 履歴と版の印を全部取る。骨の自己検査が main からの差と、出した版の節が印の時と同じかを見る
      # （浅いと CI では赤＝tests/test_骨.py の _手元に無い）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest を入れる
        run: python -m pip install pytest
      # 確認ページの型・検査・答えの形（土台の skill qa-html の check.mjs）を当てるため node を入れ、土台の main の先端から取る。
      # 型も検査も repo に写さない（土台の qa-html の SKILL.md §配り方）。版の印で止めない＝窓が入れる土台と同じ main の先端で照らす。
      # repo の外（runner の作業場）に置く。public なので秘密は要らない。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 確認ページの型と検査を土台の main から取る
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/ynishikawa-coder/agent-foundation-public "${RUNNER_TEMP}/agent-foundation-public"
          f="${RUNNER_TEMP}/agent-foundation-public/plugins/docs-kit/skills/qa-html/check.mjs"
          test -f "$f"
          echo "QA_HTML_CHECK=$f" >> "$GITHUB_ENV"
      - name: 検査
        run: bash scripts/check_all.sh
      # 確認ページの検査の試験を名で出す（skip でなく pass した記録を CI に残す）。
      - name: 確認ページの検査の試験を名で見る
        run: python -m pytest -v -rs -k "qa_html or 検査の道具" tests/確認ページ
