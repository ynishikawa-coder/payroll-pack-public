# 公開の repo に置く呼び口の雛形（.github/workflows/public-guard.yml へそのまま写す）。
# 写すのはこの呼び口だけ。検査の中身は土台の action を版の印で固定して呼ぶ（中身を写さない）。
# job の名 public-guard を変えない（main の守りの必須の検査と、見回りがこの名で見る）。
# 版の印を上げる時は @v0.4.2 の 1 か所だけを替える。手順は土台の docs/公開の検査.md。
name: public-guard

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  public-guard:
    name: public-guard
    runs-on: ubuntu-latest
    steps:
      - uses: ynishikawa-coder/agent-foundation-public/public-guard@v0.4.2
        with:
          deny-bundle: ${{ secrets.AF_DENY_BUNDLE }}
          deny-words: ${{ secrets.AF_DENY_WORDS }}
