<!doctype html>
<!-- 確認ページの雛形（payroll-pack 確認ページ/）。qa-html の 1 つの形の qa:css・qa:toc・qa:foot・qa:js の 4 か所をそのまま写し、
  {{…}} と <!--問い--> の所だけを 確認ページ.py が差し替える。4 か所の中は直さない（直す時は qa-html の正本から写し直す）。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{題}}</title>
<!--qa:css--><style>
  :root{--ink:#1b2430;--sub:#5b6674;--faint:#8b95a3;--line:#e4e8ef;--bg:#f6f8fb;--card:#fff;--acc:#3b5bdb;--acc-soft:#eef2ff;
        --ok:#15803d;--warn:#c92a2a;--warn-bg:#fff5f5;--r:14px;--r-s:9px}
  @media (prefers-color-scheme:dark){:root{--ink:#e9ecef;--sub:#adb5bd;--faint:#868e96;--line:#343a40;--bg:#141517;--card:#1c1e21;--acc:#748ffc;--acc-soft:#232a45;--warn-bg:#2c1719}}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;line-height:1.7;font-size:15px}
  .wrap{max-width:820px;margin:0 auto;padding:28px 16px 40px}
  header.top{background:linear-gradient(135deg,#20305e,#3b5bdb);color:#fff;border-radius:18px;padding:22px 24px}
  header.top .ey{font-size:12px;letter-spacing:.12em;opacity:.85;font-weight:700}
  header.top h1{margin:6px 0 6px;font-size:21px;line-height:1.4}
  header.top p{margin:0;font-size:14px;opacity:.92}
  nav.toc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:16px 0 4px;font-size:13.5px}
  nav.toc b{font-size:12px;color:var(--faint);letter-spacing:.06em}
  nav.toc ol{margin:4px 0 0;padding-left:0;list-style:none}
  nav.toc li{display:flex;gap:8px;align-items:baseline;padding:2px 0}
  nav.toc a{color:var(--ink);text-decoration:none}
  nav.toc a:hover{text-decoration:underline}
  nav.toc .mk{flex:0 0 1.2em;color:var(--faint)}
  nav.toc li.done .mk{color:var(--ok);font-weight:800}
  fieldset.q{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:var(--r);padding:16px 18px;margin:14px 0;min-width:0}
  fieldset.q[data-kind=mismatch]{border-left-color:var(--warn)}
  fieldset.q.free{border-left-color:var(--line)}
  fieldset.q legend{float:left;width:100%;padding:0;margin:0 0 6px;font-size:16.5px;font-weight:750;line-height:1.45}
  .q .known{clear:both;font-size:14px;color:var(--sub);margin:2px 0 8px}
  .q[data-kind=mismatch] .known{background:var(--warn-bg);border-radius:var(--r-s);padding:6px 10px;color:var(--ink)}
  .q .src{font-size:12.5px;color:var(--faint);margin:0 0 6px}
  .q figure{margin:10px 0}
  .q figure img{display:block;max-width:100%;height:auto;border-radius:var(--r-s);border:1px solid var(--line)}
  .q figcaption{font-size:12.5px;color:var(--faint);margin-top:4px}
  .opts{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  label.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;background:var(--card)}
  label.opt:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
  label.opt input{margin-top:4px;accent-color:var(--acc);width:16px;height:16px;flex:0 0 auto}
  label.opt b{font-weight:700}
  label.opt small{display:block;font-size:12.5px;color:var(--sub)}
  .tag-rec{font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 7px;margin-left:7px;background:var(--acc);color:#fff;vertical-align:1px}
  .q select,.q input[type=text],.q input[type=date],.q input[type=month],textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-s);padding:8px 11px;font-family:inherit;font-size:14px;background:var(--card);color:var(--ink)}
  textarea{resize:vertical;min-height:54px}
  details.more{margin:8px 0 0;font-size:13px;color:var(--sub)}
  details.more summary{cursor:pointer;color:var(--acc);font-weight:700}
  .q .decides{font-size:12.5px;color:var(--faint);margin:8px 0 0}
  .q .decides::before{content:"この答えで決まる事: ";font-weight:700}
  .supp{margin-top:8px}
  .supp label{font-size:12px;font-weight:700;color:var(--faint);display:block;margin-bottom:4px}
  .foot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:20px 0 0}
  body[data-dest=copy] .foot{position:sticky;bottom:0;box-shadow:0 -8px 24px -14px rgba(16,24,40,.35)}
  .foot #cnt{font-weight:800;font-size:14px;margin:0 0 8px;text-align:center}
  .foot #cnt.all{color:var(--ok)}
  .foot .acts{text-align:center}
  .btn{font-family:inherit;font-size:16px;font-weight:750;padding:12px 36px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
  .btn.done{background:var(--ok)}
  .foot .hint{font-size:12.5px;color:var(--faint);text-align:center;margin:6px 0 0}
  #out{height:110px;margin-top:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55}
  body[data-dest=send] .copy-only,body[data-dest=copy] .send-only{display:none}
</style><!--/qa:css-->
</head>
<body data-dest="{{宛先}}">
<div class="wrap">
<header class="top">
  <div class="ey">{{宛名}}</div>
  <h1>{{題}}</h1>
  <p>{{前書き}}</p>
</header>

<!--qa:toc--><nav class="toc" id="toc" aria-label="問いの一覧"><b>問いの一覧</b><ol></ol></nav><!--/qa:toc-->

<form>
<!--問い-->
<fieldset class="q free" data-qkey="__自由記入__" data-qlabel="ほかに伝えたい事">
<legend>ほかに伝えたい事（任意）</legend>
<textarea name="__自由記入__" rows="3"></textarea>
</fieldset>

<!--qa:foot--><div class="foot" id="foot">
<p id="cnt">0 / 0 問 答えました</p>
<div class="acts">
<button type="submit" class="btn send-only" id="sendbtn">回答を送る</button>
<button type="button" class="btn copy-only" id="copybtn">回答を写す</button>
</div>
<p class="hint send-only">送った後に受付の画面が出ます。あとから答え直せます。</p>
<p class="hint copy-only">写したテキストをチャットに貼ってください（写せない時は下の枠を全部選んで写す）。</p>
<textarea id="out" class="copy-only" readonly spellcheck="false" aria-label="貼り戻しのテキスト"></textarea>
</div><!--/qa:foot-->
</form>
</div>
<!--qa:js--><script>
/* 問いの一覧の ✓・答えた数・写す（貼り戻し）。送信の処理は書かない（送るのは素のフォーム）。 */
(function(){
  var dest = document.body.getAttribute('data-dest');
  var form = document.querySelector('form');
  var cards = [].slice.call(document.querySelectorAll('fieldset.q[data-qkey]')).filter(function(c){ return c.getAttribute('data-qkey') !== '__自由記入__'; });
  var free = document.querySelector('[name="__自由記入__"]');
  var toc = document.querySelector('#toc ol');
  var cnt = document.getElementById('cnt');
  var out = document.getElementById('out');
  if (dest === 'copy') {
    var s = document.getElementById('sendbtn'); if (s) s.parentNode.removeChild(s);
    if (form) form.addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.preventDefault(); });
  }
  var items = cards.map(function(c, i){
    if (!c.id) c.id = 'q-' + c.getAttribute('data-qkey');
    var li = document.createElement('li');
    li.innerHTML = '<span class="mk">・</span><a></a>';
    var a = li.querySelector('a'); a.href = '#' + c.id;
    var lg = c.querySelector('legend');
    a.textContent = lg ? lg.textContent.trim() : (i + 1) + '. ' + c.getAttribute('data-qlabel');
    if (toc) toc.appendChild(li);
    return li;
  });
  function optText(inp){
    var l = inp.closest('label'); if (!l) return inp.value;
    var b = l.querySelector('b'); return (b ? b.textContent : l.textContent).replace('推奨', '').trim();
  }
  function answerOf(c){
    var key = c.getAttribute('data-qkey'), vals = [];
    [].forEach.call(c.querySelectorAll('[name="' + key + '"]'), function(el){
      if (el.type === 'radio' || el.type === 'checkbox') { if (el.checked) vals.push(optText(el)); }
      else if (el.tagName === 'SELECT') { if (el.value) vals.push(el.options[el.selectedIndex].text.trim()); }
      else if (el.value && el.value.trim()) vals.push(el.value.trim());
    });
    var sp = c.querySelector('[name="supp_' + key + '"]');
    return { ans: vals.join('、'), supp: sp && sp.value.trim() };
  }
  function build(){
    var n = 0, lines = ['# ' + document.title + ' — 回答', ''];
    cards.forEach(function(c, i){
      var r = answerOf(c), done = !!(r.ans || r.supp);
      if (done) n++;
      items[i].className = done ? 'done' : '';
      items[i].querySelector('.mk').textContent = done ? '✓' : '・';
      lines.push('■ 問' + (i + 1) + ': ' + c.getAttribute('data-qlabel'));
      lines.push('   → 回答: ' + (r.ans || '（未選択）'));
      if (r.supp) lines.push('   → 補足: ' + r.supp.replace(/\n/g, ' / '));
      lines.push('');
    });
    var fn = free && free.value.trim();
    lines.push('■ その他・全体の意向:');
    lines.push('   ' + (fn ? fn.replace(/\n/g, '\n   ') : '（なし）'));
    if (out) out.value = lines.join('\n');
    cnt.textContent = n + ' / ' + cards.length + ' 問 答えました';
    cnt.className = n === cards.length ? 'all' : '';
  }
  document.addEventListener('change', build);
  document.addEventListener('input', build);
  var cb = document.getElementById('copybtn');
  if (cb) cb.addEventListener('click', function(){
    out.focus(); out.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    function flash(m){ var t = cb.textContent; cb.textContent = m; cb.classList.add('done'); setTimeout(function(){ cb.textContent = t; cb.classList.remove('done'); }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out.value).then(function(){ flash('写しました ✓'); }, function(){ flash(ok ? '写しました ✓' : '枠を全部選んで写してください'); });
    else flash(ok ? '写しました ✓' : '枠を全部選んで写してください');
  });
  build();
})();
</script><!--/qa:js-->
</body>
</html>
